name: docker-image
run-name: Docker Image CI

on:
  push:
    branches: [ "master", "test-actions" ]
  pull_request:
    branches: [ "master" ]
jobs:
  check-bats-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pwd
      - run: ls -al 