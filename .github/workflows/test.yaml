name: docker-image
run-name: Docker Image CI

on:
  push:
    branches: [ "master", "test-actions" ]
  pull_request:
    branches: [ "master" ]
jobs:
  build:
    name: Build conteiner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: nezumukun/app:latest
      - name: Test 1
        run: docker run --rm nezumukun/app:latest ls -alR /
